<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Valentine 💌</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background effects canvas (hidden until "Yes") -->
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="shell">
    <!-- ASK VIEW -->
    <section id="askView" class="card" aria-labelledby="headline">
      <div class="glow" aria-hidden="true"></div>

      <h1 id="headline" class="headline">Babe, will you be my Valentine? 💌</h1>
      <p class="subhead">A little question, with a lot of love.</p>

      <div class="actions" role="group" aria-label="Answer">
        <button id="yesBtn" class="btn btn-primary" type="button">
          Yes 💖
        </button>

        <!-- No button is positioned inside a "playground" so it can move around -->
        <div id="noZone" class="no-zone" aria-hidden="true">
          <button id="noBtn" class="btn btn-ghost" type="button">
            No 😅
          </button>
        </div>
      </div>

      <footer class="hint">
        <span class="dot" aria-hidden="true"></span>
        <span>Tip: try to click “No”.</span>
      </footer>
    </section>

    <!-- THANKS VIEW -->
    <section id="thanksView" class="card is-hidden" aria-live="polite">
      <div class="glow" aria-hidden="true"></div>

      <h1 class="headline">love you! 🎉</h1>
      <p class="subhead">YYay! It’s a date. 🥂</p>

      <div class="actions">
        <button id="replayBtn" class="btn btn-ghost" type="button">
          Replay ✨
        </button>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
